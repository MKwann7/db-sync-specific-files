# Docker Compose configuration for dbsync.
#
# Quick start:
#   cp .env.example .env            # fill in DROPBOX_APP_KEY / DROPBOX_APP_SECRET
#   cp config/config.example.yaml config/config.yaml   # edit mappings
#
#   # One-time Dropbox authorization: run this on the HOST (not in Docker),
#   # since the callback listener binds to 127.0.0.1 and Docker's container
#   # loopback is not reachable from your browser. See README.md for
#   # details, including the --manual fallback for headless hosts.
#   go run ./cmd/dbsync auth login
#   # Copy the printed DROPBOX_REFRESH_TOKEN into .env, then:
#
#   docker compose build
#   docker compose run --rm dbsync config validate
#   docker compose run --rm dbsync sync --dry-run
#   docker compose up -d
#   docker compose logs -f
#   docker compose down

services:
  dbsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: dbsync:latest
    container_name: dbsync
    restart: unless-stopped
    init: true
    environment:
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN}
      DBSYNC_CONFIG: /app/config.yaml
    volumes:
      # Configuration is read-only inside the container.
      - ./config/config.yaml:/app/config.yaml:ro
      # Persistent synchronization state (SQLite); survives restarts.
      - ./state:/app/state
      # Bind-mount the real host folder containing the file(s) you want to
      # sync. The container-side path (right of the colon) must match the
      # "local" path (and "security.allowed_roots" entry) used in
      # config/config.yaml -- the container never sees your host filesystem
      # directly, only what is explicitly mounted here.
      - "/Users/Micah.Zak@mheducation.com/Documents/CreativeWorks:/data/creative-works"
    # No ports are published: dbsync only makes outbound HTTPS requests to
    # Dropbox. The one-time `auth login` flow needs an inbound loopback
    # callback and is intended to be run on the host via
    # `go run ./cmd/dbsync auth login` (see README.md), not inside this
    # container.
